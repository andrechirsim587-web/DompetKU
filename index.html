<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>DompetKU Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-body: #f0f2f5; --bg-card: #ffffff; --text-main: #333; --primary: #6366f1; }
        body.dark { --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; }
        
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; transition: 0.3s; }
        #login-form { margin: auto; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        #login-form input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        #dashboard { display: none; width: 100%; }
        .sidebar { width: 260px; background: #1e293b; color: white; height: 100vh; padding: 25px; flex-shrink: 0; text-align: center; }
        .profile-circle { width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 30px; font-weight: bold; border: 3px solid #334155; color: white; }
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .menu-item { cursor: pointer; padding: 12px; border-radius: 8px; margin-bottom: 5px; text-align: left; }
        .menu-item:hover { background: #334155; }
        input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin: 5px 0; }
        .btn { background: var(--primary); color: white; cursor: pointer; border: none; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-form">
        <h2>Login DompetKU</h2>
        <input type="text" id="id" placeholder="ID">
        <input type="password" id="pass" placeholder="Password">
        <button class="btn" onclick="login()">Masuk</button>
    </div>

    <div id="dashboard">
        <div style="display: flex;">
            <div class="sidebar">
                <div class="profile-circle" id="profile-img">U</div>
                <h3 id="display-name" style="margin-bottom: 30px;">User</h3>
                <div class="menu-item" onclick="tampilkan('dashboard-page')">📊 Dashboard</div>
                <div class="menu-item" onclick="tampilkan('riwayat-page')">📜 Riwayat Transaksi</div>
                <div class="menu-item" onclick="tampilkan('profil-page')">👤 PROFILE</div>
            </div>

            <div class="main">
                <div id="dashboard-page">
                    <h1>Halo, <span id="welcome-name">User</span>!</h1>
                    <div class="grid-stats">
                        <div class="card"><h3>Pemasukan</h3><p id="val-income" style="color:#22c55e;">Rp 0</p></div>
                        <div class="card"><h3>Pengeluaran</h3><p id="val-expense" style="color:#ef4444;">Rp 0</p></div>
                        <div class="card"><h3>Saldo</h3><p id="val-balance" style="font-weight:bold;">Rp 0</p></div>
                    </div>
                    <div class="card">
                        <h3>Input Transaksi</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px;">
                            <input type="number" id="amount" placeholder="Nominal">
                            <input type="text" id="note" placeholder="Catatan">
                            <select id="kategori"><option value="Pemasukan">Pemasukan</option><option value="Pengeluaran">Pengeluaran</option></select>
                            <button class="btn" style="width: auto;" onclick="tambahData()">Simpan</button>
                        </div>
                    </div>
                </div>

                <div id="riwayat-page" style="display: none;">
                    <h1>Riwayat Transaksi</h1>
                    <div class="card">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead><tr style="border-bottom: 2px solid #eee; text-align: left;"><th>Tanggal</th><th>Catatan</th><th>Jenis</th><th>Nominal</th></tr></thead>
                            <tbody id="tabel-riwayat"></tbody>
                        </table>
                    </div>
                </div>

                <div id="profil-page" style="display: none;">
                    <h1>Profil Saya</h1>
                    <div class="card">
                        <h3>Ganti Nama Profil</h3>
                        <input type="text" id="input-nama" placeholder="Masukkan nama baru">
                        <button class="btn" onclick="updateProfil()">Simpan Nama</button>
                        <h3 style="margin-top: 20px;">Tema & Warna</h3>
                        <button class="btn" onclick="toggleTema()">Ganti Mode (Terang/Gelap)</button>
                        <p>Pilih Warna Aksen:</p>
                        <input type="color" id="colorPicker" onchange="gantiWarna(this.value)">
                        <hr style="margin: 20px 0;">
                        <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 10px; width: 100%; border-radius: 8px; cursor: pointer;">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let inc = 0, exp = 0;

        // Cek LocalStorage saat halaman dimuat
        window.onload = () => {
            if(localStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                
                // Load data tersimpan
                if(localStorage.getItem('userName')) {
                    let name = localStorage.getItem('userName');
                    document.getElementById('display-name').innerText = name;
                    document.getElementById('welcome-name').innerText = name;
                    document.getElementById('profile-img').innerText = name.charAt(0).toUpperCase();
                }
                if(localStorage.getItem('isDark') === 'true') document.body.classList.add('dark');
                if(localStorage.getItem('themeColor')) gantiWarna(localStorage.getItem('themeColor'));
            }
        };

        function login() {
            if(document.getElementById('id').value === '123asd' && document.getElementById('pass').value === '123asd') {
                localStorage.setItem('isLoggedIn', 'true');
                location.reload();
            } else alert('Login Gagal!');
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function updateProfil() {
            let nama = document.getElementById('input-nama').value;
            if(nama) {
                localStorage.setItem('userName', nama);
                document.getElementById('display-name').innerText = nama;
                document.getElementById('welcome-name').innerText = nama;
                document.getElementById('profile-img').innerText = nama.charAt(0).toUpperCase();
            }
        }

        function toggleTema() { 
            document.body.classList.toggle('dark'); 
            localStorage.setItem('isDark', document.body.classList.contains('dark'));
        }
        
        function gantiWarna(warna) {
            document.documentElement.style.setProperty('--primary', warna);
            localStorage.setItem('themeColor', warna);
        }

        function tampilkan(pageId) {
            ['dashboard-page', 'riwayat-page', 'profil-page'].forEach(id => {
                document.getElementById(id).style.display = (id === pageId) ? 'block' : 'none';
            });
        }

        function tambahData() { /* ... (fungsi tambah data Anda) ... */ }
    </script>
</body>
</html>
